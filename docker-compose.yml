services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uikaform
      POSTGRES_PASSWORD: uikaform
      POSTGRES_DB: uikaform
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://uikaform:uikaform@db:5432/uikaform
    depends_on: [db]
    ports:
      - "8080:8080"
volumes:
  pgdata:
