server {
    listen 80;
    server_name utility.uika-bogor.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name utility.uika-bogor.ac.id;

    ssl_certificate /etc/letsencrypt/live/utility.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utility.uika-bogor.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300M;

    # =========================================================
    # 0. Portal Utilitas UIKA (Landing Page Utama)
    # =========================================================
    root /var/www/uika-form/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # 1. OlahPDF
    # =========================================================
    location = /pdf {
        return 301 /pdf/;
    }
    location /pdf/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 2. Presensi App
    # =========================================================
    location /presensi {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 3. Detektor Teks AI
    # =========================================================
    location = /detector-text {
        return 301 /detector-text/;
    }
    location /detector-text/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /detector-text;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 4. Architect (Perancang Denah 2D/3D)
    # =========================================================
    location = /architect {
        return 301 /architect/;
    }
    location /architect/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /architect;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 5. UIKA Form (U-Form)
    # =========================================================
    location = /u-form {
        return 301 /u-form/;
    }
    location /u-form/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /u-form;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================================
    # Kompatibilitas Tautan Lama UIKA Form
    # (Mengalihkan tautan lama /s/..., /verify/..., /forms/... ke /u-form/...)
    # =========================================================
    location ~* ^/(s|verify|checkin|forms)/ {
        return 301 /u-form$request_uri;
    }
}
