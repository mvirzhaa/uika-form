server {
    listen 80;
    server_name utility.uika-bogor.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name utility.uika-bogor.ac.id;

    ssl_certificate /etc/letsencrypt/live/utility.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utility.uika-bogor.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300M;

    # =========================================================
    # 0. Portal Utilitas UIKA (Landing Page Utama)
    # =========================================================
    root /var/www/uika-form/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # 1. OlahPDF
    # =========================================================
    location = /pdf {
        return 301 /pdf/$is_args$args;
    }
    location /pdf/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 2. Presensi App
    # =========================================================
    location /presensi {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 3. Detektor Teks AI
    # =========================================================
    location = /detector-text {
        return 301 /detector-text/$is_args$args;
    }
    location /detector-text/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /detector-text;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 4. Architect (Perancang Denah 2D/3D)
    # =========================================================
    location = /architect {
        return 301 /architect/$is_args$args;
    }
    location /architect/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /architect;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 5. UIKA Form (U-Form)
    # =========================================================
    location = /u-form {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /u-form;
        proxy_cache_bypass $http_upgrade;
    }
    location /u-form/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /u-form;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================================
    # 6. UIKA Drone (U-Drone - Simulator Drone FPV)
    # =========================================================
    location = /u-drone {
        return 301 /u-drone/$is_args$args;
    }
    location /u-drone/ {
        alias /var/www/u-drone/web/;
        index index.html;

        # Cache static assets
        location ~* \.(?:css|js|svg|png|jpg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Service worker & manifest
        location ~* (sw\.js|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # =========================================================
    # 7. Optimus (Simulator Lalu Lintas & PKJI 2023)
    # =========================================================
    location = /optimus {
        return 301 /optimus/$is_args$args;
    }
    location /optimus/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /optimus;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # 8. Poster Penelitian (Pembuat Poster Akademik)
    # =========================================================
    location = /poster {
        return 301 /poster/$is_args$args;
    }
    location /poster/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /poster;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # =========================================================
    # Kompatibilitas Tautan UIKA Form
    # (Mengalihkan tautan /f/..., /s/..., /api/..., /uploads/..., /verify/..., /forms/... ke /u-form/...)
    # =========================================================
    location ~* ^/(s|f|verify|checkin|forms|api|uploads)(/.*)?$ {
        return 301 /u-form$request_uri;
    }
}
